<!DOCTYPE html>
<head>
	<title>Configure Last.fm Overlay</title>
	<meta charset="UTF-8">
	<link rel="shortcut icon" href="#" />
	<link rel="stylesheet" href="./style.css" />
</head>

<body>
	<div id="mainContainer">
		<div id="connectBox">
			<div style="text-align: center;">
				<h2 style="color: white; font-family: sans-serif;">Last.fm Overlay Setup</h2>
			</div>
			<label>
				<br>
				<span style="font-weight: 500;">Last.fm Username</span>
				<br>
				<input type="text" id="username_box">
				<br><br>
				<span style="font-weight: 500;">Last.fm API Key</span>
				<br>
				<input type="text" id="apikey_box">

				<br><br>

				<button id="generateButton" onclick="GenerateURL()">Generate OBS URL</button>
			</label>
		</div>
		
		<div id="authorizationBox" style="display: none; text-align: center; margin-top: 20px;">
			<label id="authorizationComplete">
				<span style="font-weight: 500; font-size: 20px;">URL Generated!</span>
				<br><br>
				Paste this into your OBS Browser Source.
			</label>
			<br><br>
			<button id="copyURLButton" onclick="CopyToURL()">Click to copy URL</button>
		</div>
	</div>
</body>

<script>
	let browserSourceURL = "";

	function GenerateURL() {
    const user = document.getElementById("username_box").value.trim();
    const key = document.getElementById("apikey_box").value.trim();
    
    if(!user || !key) {
        alert("Please enter both your Last.fm username and API key.");
        return;
    }

    // Hardcode the base URL to point directly to the main widget
    const baseURL = "https://mansour-error.github.io/mans_spotify_overlay2/";
    
    browserSourceURL = `${baseURL}?lastfm_user=${encodeURIComponent(user)}&lastfm_api_key=${encodeURIComponent(key)}`;
    
    document.getElementById("authorizationBox").style.display = 'block';
}

	function CopyToURL() {
		navigator.clipboard.writeText(browserSourceURL);

		const copyBtn = document.getElementById("copyURLButton");
		copyBtn.innerText = "Copied to clipboard";
		copyBtn.style.backgroundColor = "#00dd63";
		copyBtn.style.color = "#ffffff";

		setTimeout(() => {
			copyBtn.innerText = "Click to copy URL";
			copyBtn.style.backgroundColor = "";
			copyBtn.style.color = "";
		}, 3000);
	}
</script>

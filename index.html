<!DOCTYPE html>
<head>
	<title>Last.fm Widget</title>
	<meta charset="UTF-8">
	<link rel="shortcut icon" href="#" />
	<link rel="stylesheet" href="./style.css" />
</head>

<body>
	<div id="mainContainer">
		<div id="albumArtBox">
			<img id="albumArt" src="images/placeholder-album-art.png"></img>
			<img id="albumArtBack" src="images/placeholder-album-art.png"></img>
		</div>
		<div id="songInfoBox">
			<div id="songInfo">
				<div id="IAmRunningOutOfNamesForTheseBoxes">
					<div id="songLabel">Waiting for music...</div>
					<div id="artistLabel">Last.fm</div>
				</div>
			</div>
			<div id="backgroundArt">
				<img id="backgroundImage" src="images/placeholder-album-art.png"></img>
				<img id="backgroundImageBack" src="images/placeholder-album-art.png"></img>
			</div>
		</div>
	</div>
</body>

<script src="./script.js"></script>
